services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-manuable}
      POSTGRES_USER: ${POSTGRES_USER:-manuable}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manuable}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://manuable:manuable@database:5432/manuable}
      COMMERCIAL_USERNAME: ${COMMERCIAL_USERNAME:-comercial}
      COMMERCIAL_PASSWORD: ${COMMERCIAL_PASSWORD:-comercial123}
      SESSION_SECRET: ${SESSION_SECRET:-local-development-secret-change-in-production}
    command: >-
      sh -c "alembic upgrade head &&
      python -m app.seed &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

  frontend-test:
    profiles: ["test"]
    build:
      context: ./frontend
      target: test

volumes:
  postgres_data:

